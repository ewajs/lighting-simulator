<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <title>Lux Studio architecture: the host supplies data to core's Simulator; the Viewport draws it; the UI owns UI state and edits through the Simulator.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="14" fill="#ffffff"/>

  <!-- Host -->
  <rect x="20" y="20" width="230" height="430" rx="10" fill="#f4f1ea" stroke="#c9bfa8"/>
  <text x="135" y="48" text-anchor="middle" font-weight="700" fill="#3b3326">Host app</text>
  <text x="135" y="66" text-anchor="middle" font-size="12" fill="#6b604c">e.g. apps/demo</text>
  <g font-size="13" fill="#3b3326">
    <rect x="40" y="88" width="190" height="34" rx="6" fill="#fff" stroke="#c9bfa8"/>
    <text x="135" y="110" text-anchor="middle">Catalog (products)</text>
    <rect x="40" y="132" width="190" height="34" rx="6" fill="#fff" stroke="#c9bfa8"/>
    <text x="135" y="154" text-anchor="middle">Photometry provider (IES)</text>
    <rect x="40" y="176" width="190" height="34" rx="6" fill="#fff" stroke="#c9bfa8"/>
    <text x="135" y="198" text-anchor="middle">Model provider (glTF)</text>
    <rect x="40" y="220" width="190" height="34" rx="6" fill="#fff" stroke="#c9bfa8"/>
    <text x="135" y="242" text-anchor="middle">Logger</text>
    <rect x="40" y="340" width="190" height="34" rx="6" fill="#fff" stroke="#c9bfa8"/>
    <text x="135" y="362" text-anchor="middle">Display catalog (names)</text>
  </g>

  <!-- Core -->
  <rect x="300" y="20" width="560" height="230" rx="10" fill="#eaf1fb" stroke="#a9c1e3"/>
  <text x="320" y="48" font-weight="700" fill="#1f3a5f">@luxstudio/core</text>
  <text x="440" y="48" font-size="12" fill="#4a6385">no UI · pure logic tested in Node</text>
  <rect x="320" y="70" width="230" height="160" rx="8" fill="#fff" stroke="#a9c1e3"/>
  <text x="435" y="96" text-anchor="middle" font-weight="700" fill="#1f3a5f">Simulator</text>
  <g font-size="12" fill="#33496b">
    <text x="435" y="122" text-anchor="middle">scene: room + luminaires</text>
    <text x="435" y="142" text-anchor="middle">edits → new scene (pure functions)</text>
    <text x="435" y="162" text-anchor="middle">undo history (snapshots)</text>
    <text x="435" y="182" text-anchor="middle">photometry and model caches</text>
    <text x="435" y="202" text-anchor="middle">subscribe() → notifies on change</text>
  </g>
  <rect x="610" y="70" width="230" height="160" rx="8" fill="#fff" stroke="#a9c1e3"/>
  <text x="725" y="96" text-anchor="middle" font-weight="700" fill="#1f3a5f">Viewport (three.js)</text>
  <g font-size="12" fill="#33496b">
    <text x="725" y="122" text-anchor="middle">draws room, fixtures, IES lights</text>
    <text x="725" y="142" text-anchor="middle">pointer → click, long press, drag</text>
    <text x="725" y="162" text-anchor="middle">handles, snapping, dimensions</text>
    <text x="725" y="182" text-anchor="middle">onPick / setHighlighted</text>
    <text x="725" y="202" text-anchor="middle">(no selection of its own)</text>
  </g>

  <!-- UI -->
  <rect x="300" y="290" width="560" height="160" rx="10" fill="#eef7ee" stroke="#a8cfa8"/>
  <text x="320" y="318" font-weight="700" fill="#24502a">@luxstudio/ui</text>
  <text x="430" y="318" font-size="12" fill="#3f6b45">optional Lit web components</text>
  <rect x="320" y="334" width="230" height="96" rx="8" fill="#fff" stroke="#a8cfa8"/>
  <text x="435" y="360" text-anchor="middle" font-weight="700" fill="#24502a">&lt;lxs-app&gt;</text>
  <g font-size="12" fill="#3a5e3e">
    <text x="435" y="384" text-anchor="middle">owns UI state: selection,</text>
    <text x="435" y="402" text-anchor="middle">tool, view, panels, theme</text>
    <text x="435" y="420" text-anchor="middle">props down · lxs-* events up</text>
  </g>
  <rect x="610" y="334" width="230" height="96" rx="8" fill="#fff" stroke="#a8cfa8"/>
  <g font-size="12" fill="#3a5e3e">
    <text x="725" y="360" text-anchor="middle">catalog · scene list</text>
    <text x="725" y="380" text-anchor="middle">inspector · top bar</text>
    <text x="725" y="400" text-anchor="middle">&lt;lxs-viewport&gt; (wraps Viewport)</text>
    <text x="725" y="420" text-anchor="middle">view controls</text>
  </g>

  <!-- Arrows: host → core -->
  <g stroke="#5b6470" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M230,105 C270,105 280,130 318,130"/>
    <path d="M230,149 L318,149"/>
    <path d="M230,193 L318,170"/>
    <path d="M230,237 C270,237 285,205 318,195"/>
    <path d="M230,357 L318,370"/>
    <!-- Simulator ↔ Viewport -->
    <path d="M550,120 L608,120"/>
    <path d="M608,180 L552,180"/>
    <!-- lxs-app ↔ Simulator -->
    <path d="M410,332 L410,232"/>
    <path d="M460,232 L460,332"/>
    <!-- lxs-app → children -->
    <path d="M550,382 L608,382"/>
    <!-- lxs-viewport wraps Viewport -->
    <path d="M725,332 L725,232" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11" fill="#4b5563">
    <text x="579" y="113" text-anchor="middle">notifies</text>
    <text x="579" y="196" text-anchor="middle">edits</text>
    <text x="579" y="210" text-anchor="middle">(drags)</text>
    <text x="404" y="270" text-anchor="end">edits</text>
    <text x="466" y="270">notifies</text>
    <text x="579" y="374" text-anchor="middle">props</text>
    <text x="732" y="270">wraps</text>
  </g>
</svg>
